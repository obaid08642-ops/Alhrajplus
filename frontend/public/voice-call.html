<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Alhraj Plus Call</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;overflow:hidden;color:#f8fbff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07152f}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 50% 28%,#2e8fb066,transparent 34%),linear-gradient(155deg,#0b2248,#07152f 68%)}main{position:relative;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(28px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom));text-align:center}.secure{position:absolute;top:calc(22px + env(safe-area-inset-top));font-size:12px;color:#c9e8f2;background:#ffffff12;border:1px solid #ffffff1b;border-radius:99px;padding:8px 12px}.avatar-wrap{width:148px;height:148px;border-radius:50%;display:grid;place-items:center;background:#ffffff12;box-shadow:0 0 0 18px #4fb6e614,0 0 0 38px #4fb6e60a;margin-bottom:30px}.avatar{width:116px;height:116px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#4fb6e6,#1d5f91);font-size:43px;box-shadow:0 16px 40px #0005}.ringing{animation:pulse 1.7s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.045);box-shadow:0 0 0 26px #4fb6e60f,0 0 0 48px #4fb6e607}}h1{font-size:27px;line-height:1.25;margin:0;font-weight:750;max-width:90vw;overflow-wrap:anywhere}#state{margin:10px 0 0;color:#c9d7e8;font-size:15px}.badge{margin-top:17px;display:inline-flex;align-items:center;gap:7px;border-radius:99px;background:#ffffff12;color:#d6e6f4;padding:8px 13px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#84d9f6;box-shadow:0 0 13px #84d9f6}.warning{margin:18px auto 0;color:#fde2a9;font-size:12px;line-height:1.6;max-width:320px}.controls{display:flex;align-items:flex-end;justify-content:center;gap:17px;margin-top:58px}.control{border:0;width:72px;height:72px;border-radius:23px;color:#f9fdff;background:#ffffff16;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:11px;cursor:pointer;box-shadow:0 10px 26px #0003}.control svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2}.control.active{background:#8bd9f4;color:#07152f}.control.end{background:#eb4b51;color:white}.control:active{transform:scale(.96)}audio{display:none}@media(max-height:600px){.avatar-wrap{width:112px;height:112px;margin-bottom:18px}.avatar{width:88px;height:88px;font-size:32px}.controls{margin-top:34px}}
  </style>
</head>
<body>
  <main>
    <div class="secure">مكالمة صوتية آمنة</div>
    <div id="avatarWrap" class="avatar-wrap"><div class="avatar">☎</div></div>
    <h1 id="title">مكالمة صوتية</h1>
    <p id="state">جارٍ تجهيز المكالمة…</p>
    <div class="badge"><span class="dot"></span><span id="network">اتصال مباشر</span></div>
    <p id="warning" class="warning" hidden>قد تمنع بعض الشبكات الاتصال المباشر. يلزم TURN relay لاتصال موثوق على جميع الشبكات.</p>
    <audio id="remote" autoplay playsinline></audio>
    <div class="controls">
      <button id="mute" class="control" aria-label="كتم الميكروفون"><svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 5.2 2M7 10.5V11a5 5 0 0 0 8.5 3.6M17 10.5V11a5 5 0 0 1-1.1 3.2M12 18v4M8 22h8"/><path d="m3 3 18 18"/></svg><span>كتم</span></button>
      <button id="speaker" class="control active" aria-label="مكبر الصوت"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/></svg><span>مكبر الصوت</span></button>
      <button id="hang" class="control end" aria-label="إنهاء المكالمة"><svg viewBox="0 0 24 24"><path d="M4.5 15.5c3.6 3.6 11.4 3.6 15 0l-2.1-2.1a1.2 1.2 0 0 0-1.2-.3l-2 .7a1 1 0 0 1-1-.2l-2.7-2.7a1 1 0 0 1-.2-1l.7-2a1.2 1.2 0 0 0-.3-1.2L8.5 4.5C4.9 8.1 4.9 11.9 4.5 15.5z"/></svg><span>إنهاء</span></button>
    </div>
  </main>
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const to = q.get("to") || "", convo = q.get("convo") || "";
      const callId = q.get("callId") || `call_${Date.now()}`;
      const role = q.get("role") || "caller", name = q.get("name") || "Alhraj Plus";
      let ws, pc, stream, muted = false, speaker = true, token = "", backend = "", started = false, ended = false, connectedAt = 0;
      let remoteDescriptionSet = false, offerApplied = false, ringContext, ringTimer, durationTimer;
      const pendingIce = [], $ = (id) => document.getElementById(id);
      const rn = (payload) => window.ReactNativeWebView?.postMessage(JSON.stringify(payload));
      const state = (value) => { $("state").textContent = value; rn({ type: "state", value }); };
      const send = (type, data) => { if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type, to, convo_id: convo, call_id: callId, data: data || {} })); };
      const stopRing = () => { if (ringTimer) clearInterval(ringTimer); ringTimer = null; try { ringContext?.close?.(); } catch (_) {} ringContext = null; $("avatarWrap").classList.remove("ringing"); };
      const ring = () => { if (ringTimer || role !== "caller") return; try { const Ctx = window.AudioContext || window.webkitAudioContext; if (!Ctx) return; ringContext = new Ctx(); const tone = () => [0,.32].forEach(offset => { const o=ringContext.createOscillator(), g=ringContext.createGain(); o.frequency.value=440; g.gain.setValueAtTime(.0001, ringContext.currentTime+offset); g.gain.exponentialRampToValueAtTime(.07, ringContext.currentTime+offset+.02); g.gain.exponentialRampToValueAtTime(.0001, ringContext.currentTime+offset+.24); o.connect(g).connect(ringContext.destination); o.start(ringContext.currentTime+offset); o.stop(ringContext.currentTime+offset+.27); }); tone(); ringTimer=setInterval(tone,2200); $("avatarWrap").classList.add("ringing"); } catch (_) {} };
      const startDuration = () => { if (durationTimer) return; connectedAt = Date.now(); durationTimer = setInterval(() => { const seconds=Math.floor((Date.now()-connectedAt)/1000); $("state").textContent=`متصل · ${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}`; }, 1000); };
      const flushIce = async () => { if (!pc || !remoteDescriptionSet) return; while (pendingIce.length) try { await pc.addIceCandidate(pendingIce.shift()); } catch (_) {} };
      const addIce = async (candidate) => { if (!candidate) return; if (!remoteDescriptionSet) { pendingIce.push(candidate); return; } try { await pc.addIceCandidate(candidate); } catch (_) {} };
      const connected = () => { stopRing(); state("متصل · 00:00"); startDuration(); };
      const applyOffer = async (offer) => { if (!pc || !offer || offerApplied || role !== "receiver") return; offerApplied = true; try { await pc.setRemoteDescription(offer); remoteDescriptionSet = true; await flushIce(); const answer = await pc.createAnswer(); await pc.setLocalDescription(answer); send("call_answer", answer); connected(); } catch (_) { offerApplied = false; state("تعذر قبول المكالمة"); rn({ type: "error", value: "set_remote_description_failed" }); } };
      const end = (notify) => { if (ended) return; ended = true; if (notify) send("call_hangup"); stopRing(); if (durationTimer) clearInterval(durationTimer); stream?.getTracks?.().forEach(track => track.stop()); try { pc?.close(); } catch (_) {} try { ws?.close(); } catch (_) {} state("انتهت المكالمة"); rn({ type: "hangup" }); };
      async function start(cfg) { if (started || ended) return; token=cfg.token||""; if (!token) { state("تسجيل الدخول مطلوب"); rn({type:"error",value:"missing_token"}); return; } started=true; backend=(cfg.backend||location.origin).replace(/\/$/,"").replace(/^http/i,"ws"); const iceServers=Array.isArray(cfg.iceServers)&&cfg.iceServers.length?cfg.iceServers:[{urls:"stun:stun.l.google.com:19302"}]; $("warning").hidden=true; pc=new RTCPeerConnection({iceServers}); pc.ontrack=e=>{if(e.streams?.[0]) $("remote").srcObject=e.streams[0]}; pc.onicecandidate=e=>{if(e.candidate)send("call_ice",e.candidate)}; pc.onconnectionstatechange=()=>{if(pc.connectionState==="connected"){ $("warning").hidden=true; connected(); } if(pc.connectionState==="failed"&&!ended){ $("warning").hidden=false; state("تعذر الاتصال المباشر"); } if(["disconnected","closed"].includes(pc.connectionState)&&!ended)state("انقطع الاتصال")}; ws=new WebSocket(`${backend}/api/ws/chat?token=${encodeURIComponent(token)}`); ws.onerror=()=>{state("تعذر الاتصال بخادم المكالمة");rn({type:"error",value:"signaling_failed"})}; ws.onclose=()=>{if(!ended)state("انقطع اتصال الإشارة")}; ws.onopen=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true,video:false});stream.getTracks().forEach(t=>pc.addTrack(t,stream));if(role==="caller"){send("call_invite",{caller_name:name});const offer=await pc.createOffer({offerToReceiveAudio:true});await pc.setLocalDescription(offer);send("call_offer",offer);state("جارٍ الاتصال…");ring()}else state("جارٍ توصيل المكالمة…")}catch(error){state("الميكروفون غير متاح");rn({type:"error",value:String(error)})}}; ws.onmessage=async event=>{let message;try{message=JSON.parse(event.data)}catch(_){return}if(message.call_id&&message.call_id!==callId)return;if(message.type==="call_answer"&&pc&&!remoteDescriptionSet){try{await pc.setRemoteDescription(message.data);remoteDescriptionSet=true;await flushIce();connected()}catch(_){}}else if(message.type==="call_offer")await applyOffer(message.data);else if(message.type==="call_ice")await addIce(message.data);else if(message.type==="call_reject"){state("تم رفض المكالمة");rn({type:"error",value:"call_rejected"});end(false)}else if(message.type==="call_hangup")end(false)}; }
      const receiveNativeMessage=event=>{try{const message=typeof event.data==="string"?JSON.parse(event.data):event.data;if(message?.type==="voice-config")start(message);if(message?.type==="voice-event"&&message.event){const incoming=message.event;if(incoming.call_id&&incoming.call_id!==callId)return;if(incoming.type==="call_offer")applyOffer(incoming.data);else if(incoming.type==="call_ice")addIce(incoming.data);else if(incoming.type==="call_reject"){state("تم رفض المكالمة");end(false)}else if(incoming.type==="call_hangup")end(false)}}catch(_){}};
      window.addEventListener("message",receiveNativeMessage); document.addEventListener("message",receiveNativeMessage);
      $("mute").onclick=()=>{muted=!muted;stream?.getAudioTracks?.().forEach(track=>track.enabled=!muted);$("mute").classList.toggle("active",muted);$("mute").querySelector("span").textContent=muted?"تشغيل":"كتم";rn({type:"muted",value:muted})};
      $("speaker").onclick=()=>{speaker=!speaker;$("speaker").classList.toggle("active",speaker);$("speaker").querySelector("span").textContent=speaker?"مكبر الصوت":"سماعة الأذن";rn({type:"speaker",value:speaker})};
      $("hang").onclick=()=>end(true); $("title").textContent=name; rn({type:"ready"});
    })();
  </script>
</body>
</html>
