# render.yaml — Render.com Blueprint (alternative to Cloud Run)
# Deploy: connect GitHub repo on Render, it auto-detects this file.

services:
  - type: web
    name: haraj-api
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter            # 0.5 CPU / 512 MB — enough for staging
    region: frankfurt        # or singapore / oregon
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: MONGO_URL
        sync: false          # set in Render dashboard
      - key: DB_NAME
        value: haraj_plus_db
      - key: REDIS_URL
        sync: false          # managed Redis/Upstash URL required for production
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a secure value
      # Set once in Render from a password manager. Do not auto-generate here:
      # rotating it without migrating stored TOTP secrets would lock out MFA users.
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        value: admin@harajplus.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Haraj Plus <noreply@alhraj.online>
      # Defaults to ADMIN_EMAIL if unset; override only when alerts go elsewhere.
      - key: MONITORING_ALERT_EMAIL
        sync: false
      # Required for reliable WebRTC calls across restrictive mobile networks.
      # Set a real JSON ICE-server list in the Render dashboard; never commit credentials.
      - key: TURN_ICE_SERVERS_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://alhraj.online
      - key: APP_ENV
        value: production

  # External, single-run health and indexing check. Render bills cron execution
  # by active seconds and documents a $1/month minimum per cron service.
  - type: cron
    name: haraj-platform-monitor
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt
    plan: starter
    schedule: "*/5 * * * *"
    dockerCommand: 'sh -c ''curl -fsS -X POST -H "X-Cron-Secret: ${CRON_SECRET}" https://alhrajplus.onrender.com/api/cron/monitoring'''
    envVars:
      - key: CRON_SECRET
        sync: false
