# Google Cloud Build config — builds Docker image and deploys to Cloud Run
# Trigger: push to main branch (set up via Cloud Build → Triggers)
# Required substitutions in Cloud Build:
#   _SERVICE_NAME (e.g., haraj-api)
#   _REGION (e.g., me-central1 or europe-west3)
#   _ARTIFACT_REPO (e.g., haraj-images)

steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}'

  # 3. Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8001'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--set-secrets=MONGO_URL=MONGO_URL:latest,JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,X_CLIENT_SECRET=X_CLIENT_SECRET:latest,SNAPCHAT_CLIENT_SECRET=SNAPCHAT_CLIENT_SECRET:latest'
      - '--set-env-vars=DB_NAME=haraj_plus_db,FRONTEND_URL=https://alhraj.online,CLOUDINARY_CLOUD_NAME=YOUR_CLOUD_NAME,CLOUDINARY_API_KEY=YOUR_KEY,X_CLIENT_ID=YOUR_X_ID,SNAPCHAT_CLIENT_ID=YOUR_SNAP_ID'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
