# Google Cloud Build config — builds Docker image and deploys to Cloud Run
# Trigger: push to main branch (set up via Cloud Build → Triggers)
#
# Required substitutions (in Cloud Build trigger settings):
#   _SERVICE_NAME    e.g. haraj-api
#   _REGION          e.g. me-central1 (Doha)  or  europe-west3 (Frankfurt)
#   _ARTIFACT_REPO   e.g. haraj-images
#
# Required Secret Manager entries (create once in GCP console):
#   MONGO_URL, JWT_SECRET, GEMINI_API_KEY, CLOUDINARY_API_SECRET,
#   RESEND_API_KEY, X_CLIENT_SECRET, SNAPCHAT_CLIENT_SECRET, CRON_SECRET,
#   ADMIN_PASSWORD
#
# WebSockets note: Cloud Run supports WebSockets natively when:
#   1. --session-affinity is enabled (sticky sessions)
#   2. --timeout >= 3600 (the absolute maximum is 3600s for HTTP/WS)
#   3. Concurrency >= 80 (default; do not lower for chat workloads)

steps:
  # 1. Build the container image
  # Using $BUILD_ID (always set) instead of $COMMIT_SHA (only set when
  # triggered from a Git repo) so `gcloud builds submit` works manually too.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'
      - '.'

  # 2. Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}'

  # 3. Deploy to Cloud Run with WebSocket-friendly settings
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=1Gi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      # WebSocket / long-poll settings — DO NOT REDUCE
      - '--timeout=3600'
      - '--session-affinity'
      # Health check tolerance for cold starts
      - '--cpu-boost'
      # Secrets (kept in Secret Manager, never in env)
      - '--set-secrets=MONGO_URL=MONGO_URL:latest,JWT_SECRET=JWT_SECRET:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest,CLOUDINARY_API_SECRET=CLOUDINARY_API_SECRET:latest,RESEND_API_KEY=RESEND_API_KEY:latest,X_CLIENT_SECRET=X_CLIENT_SECRET:latest,SNAPCHAT_CLIENT_SECRET=SNAPCHAT_CLIENT_SECRET:latest,CRON_SECRET=CRON_SECRET:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest'
      # Plain env vars (non-sensitive)
      - '--set-env-vars=DB_NAME=haraj_plus_db,FRONTEND_URL=https://alhraj.online,CLOUDINARY_CLOUD_NAME=YOUR_CLOUD_NAME,CLOUDINARY_API_KEY=YOUR_KEY,X_CLIENT_ID=YOUR_X_ID,SNAPCHAT_CLIENT_ID=YOUR_SNAP_ID,ADMIN_EMAIL=admin@harajplus.com,RESEND_FROM=Haraj Plus <noreply@alhraj.online>,APP_ENV=production'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:${BUILD_ID}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/${_SERVICE_NAME}:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: 1200s
