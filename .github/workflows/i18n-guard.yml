name: i18n guard

on:
  pull_request:
    paths:
      - "frontend/src/**"
      - "mobile/src/**"
      - "tools/check_i18n_guard.py"
  push:
    branches: [main]
    paths:
      - "frontend/src/**"
      - "mobile/src/**"
      - "tools/check_i18n_guard.py"

jobs:
  prevent-new-untranslated-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select the approved comparison baseline
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "I18N_GUARD_BASE=origin/${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "I18N_GUARD_BASE=HEAD^" >> "$GITHUB_ENV"
          fi
      - name: Reject newly-added untranslated Arabic UI copy
        run: python3 tools/check_i18n_guard.py
